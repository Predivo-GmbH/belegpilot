<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 40 40" fill="none">
  <rect width="40" height="40" rx="8" fill="#0E7C6B"/>
  <!-- 3 horizontal bars, bottom-aligned, centered horizontally -->
  <!-- bar-top: 14x6, full white -->
  <rect x="13" y="10" width="14" height="6" rx="2" fill="#FFFFFF"/>
  <!-- bar-mid: 22x6, 80% white -->
  <rect x="9" y="20" width="22" height="6" rx="2" fill="#FFFFFF" opacity="0.8"/>
  <!-- bar-bot: 30x6, 60% white -->
  <rect x="5" y="30" width="30" height="6" rx="2" fill="#FFFFFF" opacity="0.6"/>
</svg>
