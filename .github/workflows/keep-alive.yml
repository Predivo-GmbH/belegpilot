name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */2 * *' # Every 2 days at 8:00 UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "REST API response: $response"
          if [ "$response" -eq 000 ]; then
            echo "::error::Supabase project is unreachable (paused or down)"
            exit 1
          fi
          echo "REST API is responding (status $response)"
      - name: Ping Supabase Auth
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Auth health response: $response"
          if [ "$response" -ne 200 ]; then
            echo "::error::Auth health check failed with $response"
            exit 1
          fi
      - name: Ping Supabase Storage
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/bucket" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Storage response: $response"
          echo "Supabase project is alive — all services pinged"
