name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_GATE: ${{ secrets.VITE_PASSWORD_GATE }}

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Zero-downtime 3-step deploy to Metanet (plain FTP)
      # Step 1: Upload new assets (JS/CSS with hashed names)
      - name: Upload assets
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          mirror --reverse --verbose --no-perms \
            ./dist/assets/ belegpilot.predivo.ch/assets/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      # Step 2: Upload everything else (HTML, .htaccess, favicon)
      - name: Upload root files
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          mirror --reverse --verbose --no-perms \
            --exclude assets/ \
            ./dist/ belegpilot.predivo.ch/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}

      # Step 3: Clean stale assets
      - name: Clean old assets
        run: |
          lftp -u "$FTP_USER,$FTP_PASS" "ftp://$FTP_HOST" <<SCRIPT
          set ftp:ssl-allow no
          mirror --reverse --verbose --no-perms --delete \
            ./dist/assets/ belegpilot.predivo.ch/assets/
          bye
          SCRIPT
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
