name: Deploy

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Zero-downtime 3-step deploy to Metanet (plain FTP)
      # Step 1: Upload new assets (JS/CSS with hashed names)
      - name: Upload assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          security: loose
          local-dir: ./dist/assets/
          server-dir: belegpilot.predivo.ch/assets/
          dangerous-clean-slate: false

      # Step 2: Upload everything else (HTML, .htaccess, favicon)
      - name: Upload root files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          security: loose
          local-dir: ./dist/
          server-dir: belegpilot.predivo.ch/
          exclude: |
            **/assets/**

      # Step 3: Clean stale assets
      - name: Clean old assets
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          security: loose
          local-dir: ./dist/assets/
          server-dir: belegpilot.predivo.ch/assets/
          dangerous-clean-slate: true
